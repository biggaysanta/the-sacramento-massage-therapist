<svg width="200" height="100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Define a linear gradient -->
    <linearGradient id="myGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:rgb(255,255,0);stop-opacity:1" />
      <stop offset="100%" style="stop-color:rgb(255,0,0);stop-opacity:1" />
    </linearGradient>
    <!-- Define a radial gradient -->
    <radialGradient id="myRadialGradient" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:rgb(0,255,0);stop-opacity:1" />
      <stop offset="100%" style="stop-color:rgb(0,0,255);stop-opacity:1" />
    </radialGradient>
  </defs>

  <!-- Apply the linear gradient to a rectangle -->
  <rect x="10" y="10" width="180" height="40" fill="url(#myGradient)" />

  <!-- Apply the radial gradient to a circle -->
  <circle cx="100" cy="70" r="30" fill="url(#myRadialGradient)" />
</svg>
