<div class="bg-muted-clay shadow-lg p-4 rounded-lg text-white">
  <h3 class="bg-white dark:bg-muted-clay mb-4 pb-2 border-muted-clay border-b-2 font-heading font-bold text-deep-ink dark:text-white text-xl">Recent Posts</h3>
  <ul class="space-y-2">
    {{ $recent_pages := where site.RegularPages "Section" "blog" | first 5 }}
    {{ range $recent_pages }}
      <li>
        <a href="{{ .RelPermalink }}" class="text-deep-ink dark:text-white hover:underline">{{ .Title }}</a>
      </li>
    {{ end }}
  </ul>
</div>
