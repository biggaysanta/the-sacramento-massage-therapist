{{ define "main" }}
<main"
{{ range where .Site.RegularPages "Section" "in" "blog"}}
<main class="w-[6S%]">
  <p>Pagers: {{ .NumberOfElements }}</p>
  <h2>{{ .Title }}</h2>
  {{ .Content }}
  {{ range .Pages | first 5}}
    <section>
      <h3><a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a></h3>
      {{ .Summary }}
    </section>
    {{ partial "pagination.html"}}
  {{ end }}

</main>
{{end}}
  {{ end }}
